<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Trading Vision</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<style>
body{background:#020617;color:white;text-align:center;font-family:Arial}
canvas{border:1px solid #1e293b;margin-top:10px}
button{padding:10px;background:#22c55e;border:none;border-radius:8px}
</style>
</head>
<body>

<h2>🤖 AI Trading Vision (TensorFlow)</h2>

<input type="file" id="upload">
<br><br>
<button onclick="trainModel()">Entrenar IA</button>
<button onclick="analyze()">Analizar</button>

<br>
<canvas id="c"></canvas>

<script>

let model;
let imgTensor;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// ===== CARGAR IMAGEN =====
document.getElementById("upload").onchange = e=>{
 let img = new Image();
 img.onload = ()=>{
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img,0,0);

  imgTensor = tf.browser.fromPixels(canvas)
    .resizeNearestNeighbor([64,64])
    .toFloat()
    .div(255.0)
    .expandDims();
 }
 img.src = URL.createObjectURL(e.target.files[0]);
};

// ===== MODELO IA =====
async function trainModel(){

 model = tf.sequential();

 model.add(tf.layers.conv2d({
  inputShape:[64,64,3],
  filters:16,
  kernelSize:3,
  activation:'relu'
 }));

 model.add(tf.layers.maxPooling2d({poolSize:2}));

 model.add(tf.layers.conv2d({
  filters:32,
  kernelSize:3,
  activation:'relu'
 }));

 model.add(tf.layers.flatten());

 model.add(tf.layers.dense({units:64,activation:'relu'}));
 model.add(tf.layers.dense({units:3,activation:'softmax'})); 
 // 0 = BUY, 1 = SELL, 2 = RANGE

 model.compile({
  optimizer:'adam',
  loss:'categoricalCrossentropy',
  metrics:['accuracy']
 });

 // ===== DATA SIMULADA (placeholder) =====
 const xs = tf.randomNormal([20,64,64,3]);
 const ys = tf.oneHot(tf.tensor1d([
 0,0,1,1,2,2,0,1,2,0,1,2,0,1,2,0,1,2,0,1
 ],'int32'),3);

 await model.fit(xs,ys,{
  epochs:5,
  callbacks:{
   onEpochEnd:(e,l)=>console.log("Epoch",e,l.loss)
  }
 });

 alert("Modelo entrenado (demo)");
}

// ===== ANALISIS =====
async function analyze(){

 if(!model || !imgTensor){
  alert("Carga imagen y entrena primero");
  return;
 }

 let pred = model.predict(imgTensor);
 let result = pred.argMax(1).dataSync()[0];

 let signal = ["BUY","SELL","RANGE"][result];

 // ===== ANALISIS VISUAL =====

 // tendencia simple (IA output)
 ctx.fillStyle="white";
 ctx.fillText("AI SIGNAL: "+signal,20,30);

 // zonas (simuladas por densidad vertical)
 let zones = [];

 for(let y=0;y<canvas.height;y+=20){
  zones.push(y);
 }

 ctx.strokeStyle="yellow";
 zones.slice(0,5).forEach(y=>{
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(canvas.width,y);
  ctx.stroke();
 });

 // entrada SL TP
 let mid = canvas.height/2;

 let entryY = mid;
 let slY = signal==="BUY" ? mid+60 : mid-60;
 let tpY = signal==="BUY" ? mid-100 : mid+100;

 ctx.fillStyle="green";
 ctx.fillRect(50,entryY,10,10);

 ctx.fillStyle="red";
 ctx.fillRect(50,slY,10,10);

 ctx.fillStyle="blue";
 ctx.fillRect(50,tpY,10,10);

 ctx.fillStyle="white";
 ctx.fillText("ENTRY",70,entryY);
 ctx.fillText("SL",70,slY);
 ctx.fillText("TP",70,tpY);
}

</script>

</body>
</html>
