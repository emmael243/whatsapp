<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Trading System PRO+</title>

<style>
body{background:#020617;color:#e2e8f0;font-family:Arial;padding:20px}
button{padding:10px;border-radius:8px;border:none;background:#22c55e}
pre{background:#020617;border:1px solid #1e293b;padding:15px}
.panel{margin-top:10px;background:#0f172a;padding:10px}
</style>
</head>

<body>

<h2>🤖 Trading System PRO+ (Tracking Real)</h2>

<button onclick="start()">START</button>
<button onclick="stop()">STOP</button>

<div class="panel">
Balance: <span id="bal">1000</span> $
Trades: <span id="tr">0</span>
Winrate: <span id="wr">0</span>%
</div>

<pre id="out"></pre>

<script>

let balance=1000, risk=0.01;
let trades=0,wins=0;
let running=false, int;

let signals=[];

// ===== DATA =====
async function getData(tf){
 let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf}&limit=300`);
 let d=await r.json();
 return d.map(c=>({h:+c[2],l:+c[3],c:+c[4]}));
}

// ===== INDICATORS =====
function ema(d,p){
 let k=2/(p+1), e=[d[0].c];
 for(let i=1;i<d.length;i++) e.push(d[i].c*k+e[i-1]*(1-k));
 return e;
}

function atr(d,p=14){
 let tr=[];
 for(let i=1;i<d.length;i++){
  tr.push(Math.max(
   d[i].h-d[i].l,
   Math.abs(d[i].h-d[i-1].c),
   Math.abs(d[i].l-d[i-1].c)
  ));
 }
 return tr.slice(-p).reduce((a,b)=>a+b)/p;
}

// ===== FRACTAL =====
function fractal(d){
 let i=d.length-3;
 if(d[i].l<d[i-1].l && d[i].l<d[i+1].l) return "BUY";
 if(d[i].h>d[i-1].h && d[i].h>d[i+1].h) return "SELL";
 return null;
}

// ===== TURTLE =====
function turtle(d){
 let last=d.length-1;
 let h=Math.max(...d.slice(last-20,last).map(x=>x.h));
 let l=Math.min(...d.slice(last-20,last).map(x=>x.l));
 if(d[last].c>h) return "BUY";
 if(d[last].c<l) return "SELL";
 return null;
}

// ===== STRATEGY =====
function evaluate(d15,d1h){

 let e50=ema(d1h,50), e200=ema(d1h,200);
 let trend = e50.at(-1)>e200.at(-1)?"BUY":"SELL";

 let f = fractal(d15);
 let t = turtle(d15);

 if(!f || !t) return null;

 if(f===t && t===trend){

  let price=d15.at(-1).c;
  let vol=atr(d15);

  let stop,tp;

  if(t==="BUY"){
   stop=price-vol*1.5;
   tp=price+vol*3;
  }else{
   stop=price+vol*1.5;
   tp=price-vol*3;
  }

  return {type:t,price,stop,tp,time:Date.now()};
 }

 return null;
}

// ===== SAVE SIGNAL =====
function saveSignal(sig){
 signals.push({...sig, status:"OPEN"});
}

// ===== CHECK RESULT =====
function updateSignals(data){

 signals.forEach(s=>{

  if(s.status!=="OPEN") return;

  for(let c of data){

   if(s.type==="BUY"){
    if(c.l<=s.stop){
     s.status="LOSS";
     trades++; balance-=10;
    }
    if(c.h>=s.tp){
     s.status="WIN";
     trades++; wins++; balance+=20;
    }
   }

   if(s.type==="SELL"){
    if(c.h>=s.stop){
     s.status="LOSS";
     trades++; balance-=10;
    }
    if(c.l<=s.tp){
     s.status="WIN";
     trades++; wins++; balance+=20;
    }
   }

  }

 });

}

// ===== MAIN =====
async function run(){

 let d15=await getData("15m");
 let d1h=await getData("1h");

 let sig=evaluate(d15,d1h);

 if(sig){
  saveSignal(sig);
 }

 updateSignals(d15.slice(-5));

 let wr = trades? (wins/trades*100):0;

 document.getElementById("bal").innerText=balance.toFixed(2);
 document.getElementById("tr").innerText=trades;
 document.getElementById("wr").innerText=wr.toFixed(1);

 document.getElementById("out").innerText=
`Señales activas: ${signals.length}

Última señal:
${sig? sig.type : "NINGUNA"}

Winrate: ${wr.toFixed(1)}%
`;
}

// ===== CONTROL =====
function start(){
 if(running) return;
 running=true;
 run();
 int=setInterval(run,20000);
}

function stop(){
 running=false;
 clearInterval(int);
}

</script>

</body>
</html>
