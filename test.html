<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Auto Trading System Binance</title>

<style>
body { font-family: Arial; background:#020617; color:#e2e8f0; padding:20px; }
h2 { color:#38bdf8; }
button, select { padding:10px; margin:5px; border-radius:8px; border:none; }
button { background:#22c55e; font-weight:bold; }
pre { background:#020617; border:1px solid #1e293b; padding:15px; border-radius:10px; }
</style>
</head>

<body>

<h2>📊 Auto Trading System (Binance)</h2>

<select id="symbol">
<option>BTCUSDT</option>
<option>ETHUSDT</option>
<option>BNBUSDT</option>
<option>SOLUSDT</option>
</select>

<button onclick="start()">START</button>
<button onclick="stop()">STOP</button>

<pre id="out">Esperando...</pre>

<script>

let running=false, intervalId;

const TF = [
 {label:"5m", interval:"5m", weight:1},
 {label:"15m", interval:"15m", weight:2},
 {label:"1h", interval:"1h", weight:3}
];

// ========= DATA BINANCE =========
async function getData(symbol, interval){
 const url=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=300`;
 const res=await fetch(url);
 const data=await res.json();

 return data.map(c=>({
  high:parseFloat(c[2]),
  low:parseFloat(c[3]),
  close:parseFloat(c[4])
 }));
}

// ========= INDICATORS =========
function ema(d,p){
 let k=2/(p+1), e=[d[0].close];
 for(let i=1;i<d.length;i++){
  e.push(d[i].close*k+e[i-1]*(1-k));
 }
 return e;
}

function atr(d,p=14){
 let tr=[];
 for(let i=1;i<d.length;i++){
  tr.push(Math.max(
   d[i].high-d[i].low,
   Math.abs(d[i].high-d[i-1].close),
   Math.abs(d[i].low-d[i-1].close)
  ));
 }
 return tr.slice(-p).reduce((a,b)=>a+b)/p;
}

// ========= FRACTALES =========
function fractals(d){
 let f=[];
 for(let i=2;i<d.length-2;i++){
  if(d[i].low<d[i-1].low && d[i].low<d[i+1].low) f.push({i,type:"bull"});
  if(d[i].high>d[i-1].high && d[i].high>d[i+1].high) f.push({i,type:"bear"});
 }
 return f;
}

// ========= TURTLE =========
function turtle(d){
 let s=[];
 for(let i=20;i<d.length;i++){
  let h=Math.max(...d.slice(i-20,i).map(x=>x.high));
  let l=Math.min(...d.slice(i-20,i).map(x=>x.low));
  if(d[i].close>h) s.push({i,type:"BUY"});
  if(d[i].close<l) s.push({i,type:"SELL"});
 }
 return s;
}

// ========= STRATEGY =========
function evaluate(d){

 const e50=ema(d,50), e200=ema(d,200);
 const f=fractals(d), t=turtle(d);

 const trend=e50.at(-1)>e200.at(-1)?"up":"down";
 const vol=atr(d);
 const price=d.at(-1).close;

 let score=0, action="WAIT";

 t.forEach(sig=>{
  let near=f.find(x=>Math.abs(x.i-sig.i)<3);

  if(sig.type==="BUY" && near?.type==="bull" && trend==="up"){
   score+=5; action="BUY";
  }
  if(sig.type==="SELL" && near?.type==="bear" && trend==="down"){
   score+=5; action="SELL";
  }
 });

 if(Math.abs(e50.at(-1)-e200.at(-1))/price < 0.002){
  score=0; action="WAIT";
 }

 let stop=null,tp=null;

 if(action==="BUY"){
  stop=price-vol*1.5;
  tp=price+vol*3;
 }
 if(action==="SELL"){
  stop=price+vol*1.5;
  tp=price-vol*3;
 }

 return {score,trend,action,stop,tp,vol,price};
}

// ========= BACKTEST =========
function backtest(d){
 let wins=0,loss=0;

 for(let i=50;i<d.length-10;i++){
  let r=evaluate(d.slice(0,i));
  if(r.action==="WAIT") continue;

  let future=d.slice(i,i+10);

  let hitTP=false,hitSL=false;

  for(let c of future){
   if(r.action==="BUY"){
    if(c.low<=r.stop) hitSL=true;
    if(c.high>=r.tp) hitTP=true;
   }
   if(r.action==="SELL"){
    if(c.high>=r.stop) hitSL=true;
    if(c.low<=r.tp) hitTP=true;
   }
  }

  if(hitTP) wins++;
  else if(hitSL) loss++;
 }

 let total=wins+loss;
 return total? (wins/total*100):0;
}

// ========= MAIN =========
async function analyze(){

 const s=document.getElementById("symbol").value;

 let res=[];

 for(let tf of TF){
  let d=await getData(s,tf.interval);

  let r=evaluate(d);
  let wr=backtest(d);

  res.push({...r,tf:tf.label,weight:tf.weight,wr});
 }

 res.sort((a,b)=>(b.score*b.weight)-(a.score*a.weight));
 let best=res[0];

 let confidence=(best.score*best.weight + best.wr)/2;

 document.getElementById("out").innerText=`
Activo: ${s}

ACCION: ${best.action}
Confianza: ${confidence.toFixed(1)}%
Winrate estimado: ${best.wr.toFixed(1)}%

Tendencia: ${best.trend}
TF: ${best.tf}

Entrada: ${best.price.toFixed(2)}
Stop Loss: ${best.stop?.toFixed(2)}
Take Profit: ${best.tp?.toFixed(2)}

Actualizando cada 20s...
`;
}

// ========= CONTROL =========
function start(){
 if(running) return;
 running=true;
 analyze();
 intervalId=setInterval(analyze,20000);
}

function stop(){
 running=false;
 clearInterval(intervalId);
}

</script>

</body>
</html>
